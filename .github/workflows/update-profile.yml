
name: Actualizar estadísticas del perfil

on:
  workflow_dispatch:

  schedule:
    - cron: '17 9 * * *'

  push:
    branches:
      - main
    paths:
      - 'scripts/generate-stats.mjs'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  update-profile:
    name: Generar métricas de GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Comprobar sintaxis del generador
        run: node --check scripts/generate-stats.mjs

      - name: Generar estadísticas SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: CamiloVenesia
        run: node scripts/generate-stats.mjs

      - name: Publicar estadísticas actualizadas
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/stats-dark.svg assets/stats-light.svg

          if git diff --cached --quiet; then
            echo "Las estadísticas no cambiaron."
          else
            git commit -m "Actualizar estadísticas del perfil"
            git push origin main
          fi
